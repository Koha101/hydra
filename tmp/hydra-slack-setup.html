<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #ffffff; }
  .wrap { padding: 28px 32px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  h1 { font-size: 21px; color: #1e293b; margin: 0 0 2px 0; font-family: -apple-system, system-ui, sans-serif; }
  .sub { font-size: 13px; color: #64748b; margin: 0 0 18px 0; font-family: -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hydra → Slack: how a message flows once it's set up</h1>
  <p class="sub">One Slack app (Socket Mode) → daemon (router) → bridge (MCP) → your Claude Code session. Each hop is a different process; the config files exist to wire them together.</p>

<svg width="1480" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0.5 L7,3.5 L0,6.5 Z" fill="#5C6BC0"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0.5 L7,3.5 L0,6.5 Z" fill="#10b981"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="1" refY="3.5" orient="auto">
      <path d="M7,0.5 L0,3.5 L7,6.5 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ====== MAIN ROW boxes ====== -->
  <!-- helper: box top y=120 h=108 mid=174 -->

  <!-- 1. Slack -->
  <rect x="36" y="120" width="200" height="108" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="136" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#9d174d" font-family="-apple-system,sans-serif">Slack workspace</text>
  <text x="136" y="174" text-anchor="middle" font-size="11.5" fill="#be185d" font-family="-apple-system,sans-serif">DMs · @mentions ·</text>
  <text x="136" y="190" text-anchor="middle" font-size="11.5" fill="#be185d" font-family="-apple-system,sans-serif">channels · threads</text>
  <text x="136" y="213" text-anchor="middle" font-size="10.5" fill="#db2777" font-family="ui-monospace,monospace">(cloud)</text>

  <!-- 2. Gateway -->
  <rect x="320" y="120" width="200" height="108" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af" font-family="-apple-system,sans-serif">SlackGateway</text>
  <text x="420" y="172" text-anchor="middle" font-size="11" fill="#1d4ed8" font-family="ui-monospace,monospace">slack-gateway.ts</text>
  <text x="420" y="194" text-anchor="middle" font-size="11" fill="#3b82f6" font-family="-apple-system,sans-serif">normalizes events,</text>
  <text x="420" y="210" text-anchor="middle" font-size="11" fill="#3b82f6" font-family="-apple-system,sans-serif">posts replies back</text>

  <!-- 3. Daemon -->
  <rect x="604" y="120" width="200" height="108" rx="12" fill="#eef2ff" stroke="#5C6BC0" stroke-width="2.5"/>
  <text x="704" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3" font-family="-apple-system,sans-serif">Daemon</text>
  <text x="704" y="172" text-anchor="middle" font-size="11" fill="#4338ca" font-family="ui-monospace,monospace">daemon.ts</text>
  <text x="704" y="194" text-anchor="middle" font-size="11" fill="#6366f1" font-family="-apple-system,sans-serif">access check · route</text>
  <text x="704" y="210" text-anchor="middle" font-size="11" fill="#6366f1" font-family="-apple-system,sans-serif">to session · spawn</text>

  <!-- 4. Bridge -->
  <rect x="888" y="120" width="200" height="108" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="988" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af" font-family="-apple-system,sans-serif">Bridge (MCP)</text>
  <text x="988" y="172" text-anchor="middle" font-size="11" fill="#1d4ed8" font-family="ui-monospace,monospace">bridge.ts → server.ts</text>
  <text x="988" y="194" text-anchor="middle" font-size="11" fill="#3b82f6" font-family="-apple-system,sans-serif">relays notifications</text>
  <text x="988" y="210" text-anchor="middle" font-size="11" fill="#3b82f6" font-family="-apple-system,sans-serif">& tool calls</text>

  <!-- 5. Claude main -->
  <rect x="1172" y="120" width="200" height="108" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5"/>
  <text x="1272" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46" font-family="-apple-system,sans-serif">Claude session</text>
  <text x="1272" y="172" text-anchor="middle" font-size="11" fill="#047857" font-family="-apple-system,sans-serif">"Byte" — main</text>
  <text x="1272" y="194" text-anchor="middle" font-size="11" fill="#059669" font-family="-apple-system,sans-serif">tools: reply, react,</text>
  <text x="1272" y="210" text-anchor="middle" font-size="11" fill="#059669" font-family="-apple-system,sans-serif">spawn_session…</text>

  <!-- ====== INBOUND arrows (top, indigo, left→right) ====== -->
  <line x1="236" y1="160" x2="320" y2="160" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="160" x2="604" y2="160" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="804" y1="160" x2="888" y2="160" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1088" y1="160" x2="1172" y2="160" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- inbound labels -->
  <text x="278" y="151" text-anchor="middle" font-size="9.5" fill="#5C6BC0" font-family="ui-monospace,monospace">WebSocket</text>
  <text x="562" y="151" text-anchor="middle" font-size="9.5" fill="#5C6BC0" font-family="ui-monospace,monospace">in-process</text>
  <text x="846" y="151" text-anchor="middle" font-size="9.5" fill="#5C6BC0" font-family="ui-monospace,monospace">daemon.sock</text>
  <text x="1130" y="151" text-anchor="middle" font-size="9.5" fill="#5C6BC0" font-family="ui-monospace,monospace">MCP/stdio</text>

  <!-- ====== OUTBOUND arrows (bottom, green, right→left) ====== -->
  <line x1="1172" y1="200" x2="1088" y2="200" stroke="#10b981" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="888" y1="200" x2="804" y2="200" stroke="#10b981" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="604" y1="200" x2="520" y2="200" stroke="#10b981" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="320" y1="200" x2="236" y2="200" stroke="#10b981" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="762" y="222" text-anchor="middle" font-size="9.5" fill="#059669" font-family="ui-monospace,monospace">reply() / react() travel back the same path</text>

  <!-- direction key small -->
  <circle cx="640" cy="78" r="5" fill="#5C6BC0"/>
  <text x="652" y="82" font-size="11.5" fill="#475569" font-family="-apple-system,sans-serif">inbound: your Slack message →</text>
  <circle cx="870" cy="78" r="5" fill="#10b981"/>
  <text x="882" y="82" font-size="11.5" fill="#475569" font-family="-apple-system,sans-serif">outbound: Claude's reply ←</text>

  <!-- ====== TWO TOKENS annotation on Slack↔Gateway ====== -->
  <rect x="244" y="262" width="180" height="78" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="334" y="282" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309" font-family="-apple-system,sans-serif">2 tokens needed</text>
  <text x="334" y="302" text-anchor="middle" font-size="10.5" fill="#92400e" font-family="ui-monospace,monospace">xapp-…  Socket Mode</text>
  <text x="334" y="320" text-anchor="middle" font-size="10.5" fill="#92400e" font-family="ui-monospace,monospace">xoxb-…  Bot API</text>
  <line x1="334" y1="262" x2="320" y2="228" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- ====== STATE FILES under daemon ====== -->
  <rect x="560" y="300" width="288" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="704" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" font-family="-apple-system,sans-serif">State dir  ~/.claude/channels/slack/</text>
  <text x="578" y="345" font-size="11" fill="#475569" font-family="ui-monospace,monospace">.env</text>
  <text x="700" y="345" font-size="11" fill="#64748b" font-family="-apple-system,sans-serif">tokens + CHAT_PLATFORM</text>
  <text x="578" y="365" font-size="11" fill="#475569" font-family="ui-monospace,monospace">access.json</text>
  <text x="700" y="365" font-size="11" fill="#64748b" font-family="-apple-system,sans-serif">who may DM the bot</text>
  <text x="578" y="385" font-size="11" fill="#475569" font-family="ui-monospace,monospace">daemon.sock</text>
  <text x="700" y="385" font-size="11" fill="#64748b" font-family="-apple-system,sans-serif">the unix socket</text>
  <text x="578" y="405" font-size="11" fill="#475569" font-family="ui-monospace,monospace">sessions.json</text>
  <text x="700" y="405" font-size="11" fill="#64748b" font-family="-apple-system,sans-serif">spawned-session state</text>
  <line x1="704" y1="300" x2="704" y2="228" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- ====== SPAWNED SESSIONS under Claude ====== -->
  <rect x="1150" y="300" width="244" height="120" rx="10" fill="#f0fdf4" stroke="#34d399" stroke-width="1.5"/>
  <text x="1272" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46" font-family="-apple-system,sans-serif">Spawned sub-sessions</text>
  <rect x="1170" y="336" width="92" height="34" rx="7" fill="#fff" stroke="#10b981" stroke-width="1.3"/>
  <text x="1216" y="357" text-anchor="middle" font-size="11" fill="#047857" font-family="ui-monospace,monospace">pixel</text>
  <rect x="1282" y="336" width="92" height="34" rx="7" fill="#fff" stroke="#10b981" stroke-width="1.3"/>
  <text x="1328" y="357" text-anchor="middle" font-size="11" fill="#047857" font-family="ui-monospace,monospace">nova</text>
  <text x="1272" y="392" text-anchor="middle" font-size="10.5" fill="#059669" font-family="-apple-system,sans-serif">each = its own tmux + Slack thread;</text>
  <text x="1272" y="408" text-anchor="middle" font-size="10.5" fill="#059669" font-family="-apple-system,sans-serif">daemon routes by threadId</text>
  <!-- daemon spawns / routes to subsessions -->
  <path d="M804 196 C 980 196, 1000 360, 1150 360" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <text x="980" y="285" text-anchor="middle" font-size="10" fill="#64748b" font-family="ui-monospace,monospace">spawn: / route by thread</text>

  <!-- ====== BUILD-TIME note (bridge) ====== -->
  <rect x="896" y="262" width="190" height="40" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="991" y="278" text-anchor="middle" font-size="9.8" fill="#1d4ed8" font-family="-apple-system,sans-serif">copied into plugin cache as</text>
  <text x="991" y="293" text-anchor="middle" font-size="9.8" fill="#1d4ed8" font-family="ui-monospace,monospace">…/discord/0.0.4/server.ts</text>
  <line x1="988" y1="262" x2="988" y2="228" stroke="#60a5fa" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- ====== Bottom: two processes you launch ====== -->
  <text x="40" y="470" font-size="13" font-weight="700" fill="#1e293b" font-family="-apple-system,sans-serif">Two long-running processes you start (in tmux):</text>

  <rect x="40" y="486" width="640" height="120" rx="10" fill="#1e293b"/>
  <text x="60" y="510" font-size="11.5" font-weight="700" fill="#a5b4fc" font-family="ui-monospace,monospace"># 1 — the daemon (one per platform)</text>
  <text x="60" y="534" font-size="11" fill="#e2e8f0" font-family="ui-monospace,monospace">DISCORD_STATE_DIR=~/.claude/channels/slack \</text>
  <text x="60" y="552" font-size="11" fill="#e2e8f0" font-family="ui-monospace,monospace">CHAT_PLATFORM=slack SPAWN_CWD=~/angellist \</text>
  <text x="60" y="570" font-size="11" fill="#e2e8f0" font-family="ui-monospace,monospace">./start-daemon.sh</text>
  <text x="60" y="594" font-size="10" fill="#94a3b8" font-family="ui-monospace,monospace">→ tmux session: discord-daemon</text>

  <rect x="704" y="486" width="690" height="120" rx="10" fill="#1e293b"/>
  <text x="724" y="510" font-size="11.5" font-weight="700" fill="#6ee7b7" font-family="ui-monospace,monospace"># 2 — Claude w/ the bridge (after daemon is up)</text>
  <text x="724" y="534" font-size="11" fill="#e2e8f0" font-family="ui-monospace,monospace">export DAEMON_SOCK=~/.claude/channels/slack/daemon.sock</text>
  <text x="724" y="552" font-size="11" fill="#e2e8f0" font-family="ui-monospace,monospace">export CLAUDE_CONFIG_DIR=~/.claude</text>
  <text x="724" y="570" font-size="11" fill="#e2e8f0" font-family="ui-monospace,monospace">./start-slack-byte.sh</text>
  <text x="724" y="594" font-size="10" fill="#94a3b8" font-family="ui-monospace,monospace">→ copies bridge.ts, opens tmux session: slack-byte</text>
</svg>
</div>
</body>
</html>
